<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Finance OS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --base:#0B0F14; --panel:#121821; --panel2:#182130;
    --border:#232E3D; --borderSoft:#1B2432;
    --text:#ECEFF3; --muted:#8B98A9; --faint:#5A6779;
    --gold:#D4AF37; --goldSoft:#F0D77B; --teal:#2DD4BF; --rose:#FB7185; --indigo:#8B93F8; --amber:#F5A524;
    --glow-a1: rgba(212,175,55,.15); --glow-a2: rgba(212,175,55,.05); --glow-b1: rgba(212,175,55,.08);
  }
  html[data-theme="light"]{
    --base:#F7F4EC; --panel:#FFFFFF; --panel2:#F1ECDD;
    --border:#E3DCC7; --borderSoft:#ECE6D5;
    --text:#211C10; --muted:#5F5A4C; --faint:#8C8570;
    --gold:#B8860B; --goldSoft:#D4A72C; --teal:#0F8F72; --rose:#C4384A; --indigo:#5850C4; --amber:#B5710B;
    --glow-a1: rgba(184,134,11,.10); --glow-a2: rgba(184,134,11,.04); --glow-b1: rgba(184,134,11,.06);
  }
  html[data-theme="light"] .brand-mark{ color:#fff; }
  html[data-theme="light"] .modal-actions .primary{ color:#FFFDF6; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--base);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px;}
  .shell{position:relative;display:flex;min-height:100vh;overflow:hidden;}
  .glow-a{position:absolute;top:-18%;right:-12%;width:640px;height:640px;
    background:radial-gradient(circle, var(--glow-a1) 0%, var(--glow-a2) 35%, transparent 68%);
    pointer-events:none;z-index:0;}
  .glow-b{position:absolute;bottom:-22%;left:-10%;width:560px;height:560px;
    background:radial-gradient(circle, var(--glow-b1) 0%, transparent 65%);
    pointer-events:none;z-index:0;}
  .sidebar{position:relative;z-index:1;width:232px;border-right:1px solid var(--border);
    padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:30px;}
  .brand-mark{width:32px;height:32px;border-radius:8px;
    background:linear-gradient(135deg,var(--gold),var(--amber));
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .brand-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.1;}
  .brand-sub{font-size:9.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
  .nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;
    border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:13.5px;font-family:'Inter',sans-serif;text-align:left;border-left:2px solid transparent;}
  .nav-btn:hover{background:var(--panel2);}
  .nav-btn.active{background:var(--panel2);color:var(--text);font-weight:600;border-left:2px solid var(--gold);}
  .nav-icon{width:16px;text-align:center;}
  .sidebar-footer{border-top:1px solid var(--borderSoft);padding-top:14px;margin-top:14px;}
  .main{position:relative;z-index:1;flex:1;padding:26px 32px;overflow-y:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .topbar-label{font-size:12px;color:var(--faint);font-family:'IBM Plex Mono',monospace;}
  .topbar-month{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);
    border:1px solid var(--border);border-radius:8px;padding:6px 12px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint);margin-bottom:6px;}
  .section-title{font-family:'Fraunces',serif;font-size:22px;color:var(--text);font-weight:600;}
  .section-sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;}
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-16-1{grid-template-columns:1.6fr 1fr;}
  .grid-09-11{grid-template-columns:.9fr 1.1fr;}
  .stat-value{font-family:'Fraunces',serif;font-size:26px;color:var(--text);font-weight:600;}
  .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .delta{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .delta-sub{font-size:12px;color:var(--faint);}
  .card-title{font-family:'Fraunces',serif;font-size:17px;color:var(--text);margin-bottom:10px;}
  .legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;}
  table{width:100%;border-collapse:collapse;margin-top:8px;}
  th{text-align:left;font-size:11px;color:var(--faint);font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;letter-spacing:.06em;padding:8px 4px;border-bottom:1px solid var(--border);}
  th.r,td.r{text-align:right;}
  td{padding:10px 4px;font-size:13px;color:var(--text);border-bottom:1px solid var(--borderSoft);}
  .badge{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:2px 9px;border-radius:20px;}
  .progress-track{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:20px;}
  .kv-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);
    margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .mini-box{background:var(--panel2);border-radius:8px;padding:8px 10px;}
  .mini-label{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;}
  .mini-value{color:var(--text);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .insight-item{display:flex;gap:10px;padding:12px;background:var(--panel2);border-radius:10px;border:1px solid var(--borderSoft);}
  .insight-text{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .page{display:none;}
  .page.active{display:block;}
  .btn-add{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
    border:1px solid var(--border);color:var(--text);font-family:'Inter',sans-serif;
    font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .btn-add:hover{border-color:var(--gold);color:var(--gold);}
  .btn-add.income:hover{border-color:var(--teal);color:var(--teal);}
  .btn-add.expense:hover{border-color:var(--rose);color:var(--rose);}
  .plus{font-size:15px;line-height:1;font-weight:600;}
  .page-actions{display:flex;gap:10px;margin-bottom:18px;}
  .edit-input{background:var(--panel2);border:1px solid var(--borderSoft);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;border-radius:6px;padding:4px 8px;
    width:110px;text-align:right;}
  .edit-input:focus{outline:none;border-color:var(--gold);}
  .edit-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;
    align-items:center;justify-content:center;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:24px;width:340px;max-width:90vw;}
  .modal-title{font-family:'Fraunces',serif;font-size:17px;margin-bottom:16px;}
  .form-row{margin-bottom:14px;}
  .form-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:6px;display:block;}
  .form-input,.form-select{width:100%;background:var(--panel2);border:1px solid var(--borderSoft);
    color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 10px;border-radius:8px;}
  .form-input:focus,.form-select:focus{outline:none;border-color:var(--gold);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;}
  .modal-actions .primary{background:var(--gold);border-color:var(--gold);color:#1A1305;font-weight:600;}
  .icon-btn{background:transparent;border:1px solid var(--borderSoft);color:var(--faint);
    width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:13px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--rose);color:var(--rose);}
  .icon-btn.edit-btn:hover{border-color:var(--gold);color:var(--gold);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .card-top-actions{display:flex;gap:6px;}
  @media (max-width: 860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;align-items:center;padding:12px;border-right:none;border-bottom:1px solid var(--border);}
    .sidebar > div:nth-child(1){margin-bottom:0;flex-shrink:0;}
    .nav-list{display:flex;gap:4px;flex:1;}
    .nav-btn{white-space:nowrap;}
    .sidebar-footer{display:none;}
    .grid-4,.grid-3,.grid-2,.grid-16-1,.grid-09-11{grid-template-columns:1fr;}
    .main{padding:18px;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">💰</div>
      <div>
        <div class="brand-name">Ledger</div>
        <div class="brand-sub">Finance OS</div>
      </div>
    </div>
    <div class="nav-list" id="navList" style="flex:1"></div>
    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--faint);padding:0 8px;">Skor Kesehatan</div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 8px 0;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--gold);font-weight:600;" id="healthScoreMini"></span>
        <span style="font-size:11px;color:var(--faint);">/ 100</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-label">PERSONAL FINANCE OS · PROTOTIPE</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="btn-add" id="themeToggle" onclick="setTheme(document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light')">☀ Mode Terang</button>
        <div class="topbar-month">Agustus 2026 ▾</div>
      </div>
    </div>
    <div id="pages"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Tambah Transaksi</div>
    <div class="form-row">
      <label class="form-label">Kategori</label>
      <select class="form-select" id="modalCategory"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Nominal (Rp)</label>
      <input class="form-input" id="modalAmount" type="number" min="0" step="1000" placeholder="contoh: 500000" />
    </div>
    <div class="modal-actions">
      <button id="modalCancel">Batal</button>
      <button class="primary" id="modalSave">Simpan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="budgetModalOverlay">
  <div class="modal-box">
    <div class="modal-title">Tambah Kategori Anggaran</div>
    <div class="form-row">
      <label class="form-label">Kategori (pilih dari daftar atau ketik sendiri)</label>
      <input class="form-input" id="budgetModalCategory" list="expenseCategoryList" placeholder="contoh: Cicilan Motor" />
      <datalist id="expenseCategoryList"></datalist>
    </div>
    <div class="form-row">
      <label class="form-label">Budget (Rp)</label>
      <input class="form-input" id="budgetModalBudget" type="number" min="0" step="10000" placeholder="contoh: 1000000" />
    </div>
    <div class="form-row">
      <label class="form-label">Realisasi Saat Ini (Rp)</label>
      <input class="form-input" id="budgetModalActual" type="number" min="0" step="10000" placeholder="0" value="0" />
    </div>
    <div class="modal-actions">
      <button id="budgetModalCancel">Batal</button>
      <button class="primary" id="budgetModalSave">Simpan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="goalModalOverlay">
  <div class="modal-box">
    <div class="modal-title">Tambah Target Keuangan</div>
    <div class="form-row">
      <label class="form-label">Nama Target</label>
      <input class="form-input" id="goalModalName" type="text" placeholder="contoh: Dana Pendidikan Anak" />
    </div>
    <div class="form-row">
      <label class="form-label">Target Dana (Rp)</label>
      <input class="form-input" id="goalModalTarget" type="number" min="0" step="1000000" placeholder="contoh: 50000000" />
    </div>
    <div class="form-row">
      <label class="form-label">Dana Terkumpul Saat Ini (Rp)</label>
      <input class="form-input" id="goalModalCurrent" type="number" min="0" step="100000" placeholder="0" value="0" />
    </div>
    <div class="form-row">
      <label class="form-label">Rencana Nabung / Bulan (Rp)</label>
      <input class="form-input" id="goalModalPerMonth" type="number" min="0" step="100000" placeholder="contoh: 1000000" />
    </div>
    <div class="modal-actions">
      <button id="goalModalCancel">Batal</button>
      <button class="primary" id="goalModalSave">Simpan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="investModalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="investModalTitle">Tambah Investasi</div>
    <div class="form-row">
      <label class="form-label">Nama Instrumen</label>
      <input class="form-input" id="investModalName" type="text" placeholder="contoh: Reksa Dana Pasar Uang" />
    </div>
    <div class="form-row">
      <label class="form-label">Kategori</label>
      <select class="form-select" id="investModalCategory"></select>
    </div>
    <div class="form-row">
      <label class="form-label">Modal Awal (Rp)</label>
      <input class="form-input" id="investModalModal" type="number" min="0" step="100000" placeholder="contoh: 10000000" />
    </div>
    <div class="form-row">
      <label class="form-label">Nilai Saat Ini (Rp)</label>
      <input class="form-input" id="investModalNilai" type="number" min="0" step="100000" placeholder="contoh: 11000000" />
    </div>
    <div class="modal-actions">
      <button id="investModalCancel">Batal</button>
      <button class="primary" id="investModalSave">Simpan</button>
    </div>
  </div>
</div>

<script>
/* ---------------- data ---------------- */
const C = { gold:"#D4AF37", goldSoft:"#F0D77B", teal:"#2DD4BF", rose:"#FB7185", indigo:"#8B93F8", amber:"#F5A524", faint:"#5A6779", panel:"#121821", panel2:"#182130" };

const monthly = [
  {m:"Agu",income:0,expense:0},
];

let incomeItems = [];

let expenseBreakdown = [];

const PALETTE = [C.gold,C.teal,C.indigo,C.amber,C.rose,C.faint,"#7DD3FC","#C4B5FD"];
function colorForCategory(existing){
  return PALETTE[existing.length % PALETTE.length];
}
function recomputeCurrentMonth(){
  const last = monthly[monthly.length-1];
  last.income = incomeItems.reduce((a,b)=>a+b.amount,0);
  last.expense = expenseBreakdown.reduce((a,b)=>a+b.value,0);
  last.net = last.income - last.expense;
}
monthly.forEach(d=>{ if(d.net===undefined) d.net = d.income-d.expense; });
recomputeCurrentMonth();

const INCOME_CATEGORIES = ["Gaji","Bonus","Freelance","Trading","Dividen","Bunga","Cashback","Penjualan","Bisnis","Pendapatan Pasif","Lainnya"];
const EXPENSE_CATEGORIES = ["Rumah","Makanan","Transportasi","Internet","Listrik","Air","Belanja","Kesehatan","Asuransi","Pendidikan","Investasi","Trading","Sedekah","Donasi","Hiburan","Liburan","Keluarga","Pajak","Lainnya"];

const budgets = [];

let goals = [];

const netWorthHistory = [
  {m:"Agu",assets:0,liabilities:0},
].map(d=>({...d,netWorth:d.assets-d.liabilities}));

let investments = [];
const INVESTMENT_CATEGORIES = ["Saham","Reksa Dana","Obligasi","Emas","Kripto","Future Trading","Deposito","Properti","Bisnis","P2P Lending","ETF"];

const healthComponents = [
  {label:"Saving Rate",score:0},
  {label:"Dana Darurat",score:0},
  {label:"Rasio Investasi",score:0},
  {label:"Rasio Hutang",score:0},
  {label:"Likuiditas",score:0},
  {label:"Disiplin Budget",score:0},
];
const healthScore = Math.round(healthComponents.reduce((a,b)=>a+b.score,0)/healthComponents.length);
document.getElementById("healthScoreMini").textContent = healthScore;

/* ---------------- helpers ---------------- */
function rp(n, compact){
  if(compact){
    const abs = Math.abs(n);
    if(abs>=1e9) return (n/1e9).toFixed(2).replace(/\.00$/,"")+" M";
    if(abs>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+" Jt";
    if(abs>=1e3) return (n/1e3).toFixed(0)+" Rb";
    return n.toString();
  }
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function el(tag, attrs={}, html=""){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=> e.setAttribute(k,v));
  e.innerHTML = html;
  return e;
}

/* ---------------- theme ---------------- */
function themeColor(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function setTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  try{ localStorage.setItem("ledger-theme", mode); }catch(e){}
  const btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = mode==="light" ? "☾ Mode Gelap" : "☀ Mode Terang";
  document.querySelectorAll(".page").forEach(p=>{ if(p.dataset.rendered) p.dataset.rendered=""; });
  const activeBtn = document.querySelector(".nav-btn.active");
  if(activeBtn) renderPage(activeBtn.dataset.id);
}

/* ---------------- svg chart builders ---------------- */
function svgAreaChart(data, keys, width=600, height=220){
  const pad = {l:50,r:10,t:10,b:24};
  const w = width-pad.l-pad.r, h = height-pad.t-pad.b;
  const gridColor = themeColor('--borderSoft'), textColor = themeColor('--faint');
  const maxV = Math.max(1, ...data.flatMap(d=>keys.map(k=>d[k.key])));
  const x = i => pad.l + (i/Math.max(1,data.length-1))*w;
  const y = v => pad.t + h - (v/maxV)*h;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">`;
  // grid
  for(let i=0;i<=4;i++){
    const gy = pad.t + (h/4)*i;
    svg += `<line x1="${pad.l}" y1="${gy}" x2="${width-pad.r}" y2="${gy}" stroke="${gridColor}" stroke-width="1"/>`;
    const val = maxV - (maxV/4)*i;
    svg += `<text x="${pad.l-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="${textColor}" font-family="IBM Plex Mono, monospace">${rp(val,true)}</text>`;
  }
  data.forEach((d,i)=> svg += `<text x="${x(i)}" y="${height-6}" text-anchor="middle" font-size="11" fill="${textColor}" font-family="IBM Plex Mono, monospace">${d.m}</text>`);
  keys.forEach(k=>{
    let path = data.map((d,i)=> (i===0?"M":"L")+x(i)+","+y(d[k.key])).join(" ");
    let area = path + ` L${x(data.length-1)},${pad.t+h} L${x(0)},${pad.t+h} Z`;
    svg += `<path d="${area}" fill="${k.color}" opacity="0.15"/>`;
    svg += `<path d="${path}" fill="none" stroke="${k.color}" stroke-width="2.2"/>`;
    data.forEach((d,i)=> svg += `<circle cx="${x(i)}" cy="${y(d[k.key])}" r="3" fill="${k.color}"/>`);
  });
  svg += `</svg>`;
  return svg;
}

function svgBarChart(data, key, width=600, height=240){
  const pad = {l:50,r:10,t:10,b:24};
  const w = width-pad.l-pad.r, h = height-pad.t-pad.b;
  const zeroColor = themeColor('--border'), textColor = themeColor('--faint');
  const posColor = themeColor('--teal'), negColor = themeColor('--rose');
  const vals = data.map(d=>d[key]);
  const maxV = Math.max(...vals), minV = Math.min(0,...vals);
  const range = (maxV-minV) || 1;
  const zeroY = pad.t + h - ((0-minV)/range)*h;
  const bw = w/data.length*0.55;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">`;
  svg += `<line x1="${pad.l}" y1="${zeroY}" x2="${width-pad.r}" y2="${zeroY}" stroke="${zeroColor}" stroke-width="1"/>`;
  data.forEach((d,i)=>{
    const cx = pad.l + (i+0.5)*(w/data.length);
    const val = d[key];
    const barH = Math.abs(val/range)*h;
    const yTop = val>=0 ? zeroY-barH : zeroY;
    const color = val>=0 ? posColor : negColor;
    svg += `<rect x="${cx-bw/2}" y="${yTop}" width="${bw}" height="${barH}" rx="4" fill="${color}"/>`;
    svg += `<text x="${cx}" y="${height-6}" text-anchor="middle" font-size="11" fill="${textColor}" font-family="IBM Plex Mono, monospace">${d.m}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function svgPieChart(data, size=220){
  const total = data.reduce((a,b)=>a+b.value,0);
  const cx=size/2, cy=size/2, rOuter=size*0.36, rInner=size*0.22;
  const sep = themeColor('--panel');
  let angle=-90;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">`;
  data.forEach(d=>{
    const frac = d.value/total;
    const a0 = angle, a1 = angle + frac*360;
    angle = a1;
    const toXY = (r,a)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
    const [x0,y0]=toXY(rOuter,a0), [x1,y1]=toXY(rOuter,a1);
    const [xi1,yi1]=toXY(rInner,a1), [xi0,yi0]=toXY(rInner,a0);
    const large = (a1-a0)>180?1:0;
    const path = `M${x0},${y0} A${rOuter},${rOuter} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${rInner},${rInner} 0 ${large} 0 ${xi0},${yi0} Z`;
    svg += `<path d="${path}" fill="${d.color}" stroke="${sep}" stroke-width="2"/>`;
  });
  svg += `</svg>`;
  return svg;
}

function svgGauge(score, size=220){
  const cx=size/2, cy=size/2+10, r=size*0.34;
  const trackColor = themeColor('--panel2'), goldColor = themeColor('--gold'), textColor = themeColor('--muted');
  const startA=220, endA=-40;
  const frac = score/100;
  const a1 = startA - (startA-endA)*frac;
  const toXY=(rr,a)=>[cx+rr*Math.cos(a*Math.PI/180), cy-rr*Math.sin(a*Math.PI/180)];
  const [bx0,by0]=toXY(r,startA), [bx1,by1]=toXY(r,endA);
  const [fx0,fy0]=toXY(r,startA), [fx1,fy1]=toXY(r,a1);
  const largeBg = (startA-endA)>180?1:0;
  const largeFg = (startA-a1)>180?1:0;
  let svg = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="${size}">`;
  svg += `<path d="M${bx0},${by0} A${r},${r} 0 ${largeBg} 1 ${bx1},${by1}" fill="none" stroke="${trackColor}" stroke-width="16" stroke-linecap="round"/>`;
  svg += `<path d="M${fx0},${fy0} A${r},${r} 0 ${largeFg} 1 ${fx1},${fy1}" fill="none" stroke="${goldColor}" stroke-width="16" stroke-linecap="round"/>`;
  svg += `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="42" fill="${goldColor}" font-family="Fraunces, serif" font-weight="600">${score}</text>`;
  svg += `<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12" fill="${textColor}" font-family="IBM Plex Mono, monospace">dari 100</text>`;
  svg += `</svg>`;
  return svg;
}

function statCard(label, value, deltaTxt, positive, icon, accent){
  return `<div class="card">

function buildInsights(){
  const last = monthly[monthly.length-1];
  const items = [];
  if(expenseBreakdown.length){
    const top = [...expenseBreakdown].sort((a,b)=>b.value-a.value)[0];
    const total = expenseBreakdown.reduce((a,b)=>a+b.value,0);
    items.push({icon:"◆", color:C.amber, text:`Pengeluaran terbesar bulan ini: ${top.name} sebesar ${rp(top.value,true)} (${((top.value/total)*100).toFixed(0)}% dari total pengeluaran).`});
  }
  if(last.income>0){
    const sr = ((last.net/last.income)*100).toFixed(0);
    items.push(last.net>=0
      ? {icon:"✓", color:C.teal, text:`Saving rate bulan ini ${sr}% — arus kas positif sebesar ${rp(last.net,true)}.`}
      : {icon:"⚠", color:C.rose, text:`Arus kas negatif ${rp(Math.abs(last.net),true)} bulan ini — pengeluaran melebihi pemasukan.`});
  }
  const overBudget = budgets.filter(b=>b.actual>b.budget);
  if(overBudget.length){
    items.push({icon:"⚠", color:C.rose, text:`${overBudget.length} kategori anggaran melebihi budget: ${overBudget.map(b=>b.cat).join(", ")}.`});
  }
  const behind = goals.filter(g=>g.status==="Terlambat");
  if(behind.length){
    items.push({icon:"⏱", color:C.amber, text:`${behind.length} target keuangan berstatus terlambat: ${behind.map(g=>g.name).join(", ")}.`});
  }
  if(!items.length){
    return [
      {icon:"＋", color:C.teal, text:"Klik \u201c+ Tambah Pemasukan\u201d untuk mencatat gaji atau penghasilan lain bulan ini."},
      {icon:"＋", color:C.rose, text:"Klik \u201c+ Tambah Pengeluaran\u201d setiap ada transaksi keluar, supaya laporan tetap akurat."},
      {icon:"💼", color:C.gold, text:"Isi Anggaran per kategori di halaman Anggaran supaya realisasi vs rencana bisa dipantau."},
      {icon:"◎", color:C.indigo, text:"Tambahkan Target Keuangan untuk mulai melacak progres menuju tujuan Anda."},
    ];
  }
  return items;
}

  btn.addEventListener("click", ()=> setActive(n.id));
  navList.appendChild(btn);

  const page = el("div",{class:"page","id":"page-"+n.id});
  pagesWrap.appendChild(page);
});

function renderPage(id){
  const target = document.getElementById("page-"+id);
  const n = NAV.find(x=>x.id===id);
  target.innerHTML = n.build();
  target.dataset.rendered = "1";
  if(id==="budget") attachBudgetListeners(target);
  if(id==="goals") attachGoalsListeners(target);
}

function setActive(id){
  document.querySelectorAll(".nav-btn").forEach(b=> b.classList.toggle("active", b.dataset.id===id));
  document.querySelectorAll(".page").forEach(p=> p.classList.toggle("active", p.id==="page-"+id));
  const target = document.getElementById("page-"+id);
  if(!target.dataset.rendered) renderPage(id);
}

/* ---------------- add-transaction modal ---------------- */
let modalType = "income";
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalCategory = document.getElementById("modalCategory");
const modalAmount = document.getElementById("modalAmount");

function openModal(type){
  modalType = type;
  modalTitle.textContent = type==="income" ? "Tambah Pemasukan" : "Tambah Pengeluaran";
  const cats = type==="income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  modalCategory.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  modalAmount.value = "";
  modalOverlay.classList.add("open");
}
function closeModal(){ modalOverlay.classList.remove("open"); }

document.getElementById("modalCancel").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", e=>{ if(e.target===modalOverlay) closeModal(); });

document.getElementById("modalSave").addEventListener("click", ()=>{
  const cat = modalCategory.value;
  const amount = parseFloat(modalAmount.value);
  if(!amount || amount<=0){ modalAmount.focus(); return; }

  if(modalType==="income"){
    const existing = incomeItems.find(i=>i.cat===cat);
    if(existing) existing.amount += amount; else incomeItems.push({cat,amount});
  } else {
    const existing = expenseBreakdown.find(e=>e.name===cat);
    if(existing) existing.value += amount;
    else expenseBreakdown.push({name:cat, value:amount, color: colorForCategory(expenseBreakdown)});
  }
  recomputeCurrentMonth();
  closeModal();

  ["overview","cashflow"].forEach(id=>{
    const p = document.getElementById("page-"+id);
    if(p.dataset.rendered) renderPage(id);
  });
});

/* ---------------- add-budget-category modal ---------------- */
const budgetModalOverlay = document.getElementById("budgetModalOverlay");
const budgetModalCategory = document.getElementById("budgetModalCategory");
const budgetModalBudget = document.getElementById("budgetModalBudget");
const budgetModalActual = document.getElementById("budgetModalActual");
document.getElementById("expenseCategoryList").innerHTML = EXPENSE_CATEGORIES.map(c=>`<option value="${c}">`).join("");

function openBudgetModal(){
  budgetModalCategory.value = "";
  budgetModalBudget.value = "";
  budgetModalActual.value = "0";
  budgetModalOverlay.classList.add("open");
}
function closeBudgetModal(){ budgetModalOverlay.classList.remove("open"); }
document.getElementById("budgetModalCancel").addEventListener("click", closeBudgetModal);
budgetModalOverlay.addEventListener("click", e=>{ if(e.target===budgetModalOverlay) closeBudgetModal(); });
document.getElementById("budgetModalSave").addEventListener("click", ()=>{
  const cat = budgetModalCategory.value.trim();
  const budgetVal = parseFloat(budgetModalBudget.value);
  const actualVal = parseFloat(budgetModalActual.value)||0;
  if(!cat){ budgetModalCategory.focus(); return; }
  if(!budgetVal || budgetVal<=0){ budgetModalBudget.focus(); return; }
  const existing = budgets.find(b=>b.cat.toLowerCase()===cat.toLowerCase());
  if(existing){ existing.budget = budgetVal; existing.actual = actualVal; }
  else budgets.push({cat, budget: budgetVal, actual: actualVal});
  closeBudgetModal();
  renderPage("budget");
});

/* ---------------- add-goal modal ---------------- */
const goalModalOverlay = document.getElementById("goalModalOverlay");
const goalModalName = document.getElementById("goalModalName");
const goalModalTarget = document.getElementById("goalModalTarget");
const goalModalCurrent = document.getElementById("goalModalCurrent");
const goalModalPerMonth = document.getElementById("goalModalPerMonth");

function openGoalModal(){
  goalModalName.value = "";
  goalModalTarget.value = "";
  goalModalCurrent.value = "0";
  goalModalPerMonth.value = "";
  goalModalOverlay.classList.add("open");
}
function closeGoalModal(){ goalModalOverlay.classList.remove("open"); }
document.getElementById("goalModalCancel").addEventListener("click", closeGoalModal);
goalModalOverlay.addEventListener("click", e=>{ if(e.target===goalModalOverlay) closeGoalModal(); });
document.getElementById("goalModalSave").addEventListener("click", ()=>{
  const name = goalModalName.value.trim();
  const target = parseFloat(goalModalTarget.value);
  const current = parseFloat(goalModalCurrent.value)||0;
  const perMonth = parseFloat(goalModalPerMonth.value);
  if(!name){ goalModalName.focus(); return; }
  if(!target || target<=0){ goalModalTarget.focus(); return; }
  if(!perMonth || perMonth<=0){ goalModalPerMonth.focus(); return; }
  const pct = current/target;
  const status = pct>=1 ? "Tercapai" : pct>=0.85 ? "Tercapai Sebentar Lagi" : "On Track";
  goals.push({name, target, current, perMonth, status});
  closeGoalModal();
  renderPage("goals");
});

/* ---------------- investment add/edit/delete ---------------- */
const investModalOverlay = document.getElementById("investModalOverlay");
const investModalTitle = document.getElementById("investModalTitle");
const investModalName = document.getElementById("investModalName");
const investModalCategory = document.getElementById("investModalCategory");
const investModalModal = document.getElementById("investModalModal");
const investModalNilai = document.getElementById("investModalNilai");
let editingInvestmentIdx = null;

function openInvestmentModal(idx){
  investModalCategory.innerHTML = INVESTMENT_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
  if(idx===undefined || idx===null){
    editingInvestmentIdx = null;
    investModalTitle.textContent = "Tambah Investasi";
    investModalName.value = "";
    investModalCategory.value = INVESTMENT_CATEGORIES[0];
    investModalModal.value = "";
    investModalNilai.value = "";
  } else {
    editingInvestmentIdx = idx;
    const inv = investments[idx];
    investModalTitle.textContent = "Edit Investasi";
    investModalName.value = inv.name;
    investModalCategory.value = inv.cat;
    investModalModal.value = inv.modal;
    investModalNilai.value = inv.nilai;
  }
  investModalOverlay.classList.add("open");
}
function closeInvestModal(){ investModalOverlay.classList.remove("open"); }
document.getElementById("investModalCancel").addEventListener("click", closeInvestModal);
investModalOverlay.addEventListener("click", e=>{ if(e.target===investModalOverlay) closeInvestModal(); });
document.getElementById("investModalSave").addEventListener("click", ()=>{
  const name = investModalName.value.trim();
  const cat = investModalCategory.value;
  const modalAmt = parseFloat(investModalModal.value);
  const nilai = parseFloat(investModalNilai.value);
  if(!name){ investModalName.focus(); return; }
  if(!modalAmt || modalAmt<=0){ investModalModal.focus(); return; }
  if(nilai===undefined || nilai<0 || isNaN(nilai)){ investModalNilai.focus(); return; }

  if(editingInvestmentIdx!==null){
    const inv = investments[editingInvestmentIdx];
    inv.name = name; inv.cat = cat; inv.modal = modalAmt; inv.nilai = nilai;
  } else {
    investments.push({name, cat, modal: modalAmt, nilai, color: colorForCategory(investments)});
  }
  closeInvestModal();
  renderPage("investasi");
});
function deleteInvestment(idx){
  investments.splice(idx,1);
  renderPage("investasi");
}

let savedTheme = "dark";
try{ savedTheme = localStorage.getItem("ledger-theme") || "dark"; }catch(e){}
document.documentElement.setAttribute("data-theme", savedTheme);
document.getElementById("themeToggle").textContent = savedTheme==="light" ? "☾ Mode Gelap" : "☀ Mode Terang";

setActive("overview");
</script>
